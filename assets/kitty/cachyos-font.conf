# Use the Nerd Font for Latin text and map CJK ranges to the simplified-Chinese fallback.
font_family FantasqueSansM Nerd Font Mono
symbol_map U+3000-U+303F Noto Sans Mono CJK SC
symbol_map U+3400-U+4DBF Noto Sans Mono CJK SC
symbol_map U+4E00-U+9FFF Noto Sans Mono CJK SC
symbol_map U+F900-U+FAFF Noto Sans Mono CJK SC
symbol_map U+FF00-U+FFEF Noto Sans Mono CJK SC
symbol_map U+E000-U+F8FF FantasqueSansM Nerd Font Mono
