# 让麦克风采集源保持唤醒，避免听写开始时丢掉第一个字。
#
# WirePlumber 默认在采集源空闲 5 秒后挂起它。再次开始时，部分 codec（尤其
# 是 DMIC / SOF / 蓝牙）需要 0.5–0.8 秒上电；这段时间设备输出的是精确静音，
# 音频永远不会到达应用，所以 Voxtype 录到的开头会被吞掉，看起来像"第一个字
# 或前两个字没了"（上游 voxtype issue #817）。
#
# 把这个节点的 session.suspend-timeout-seconds 设为 0 后，源保持 idle、PCM
# 常开但不产生采集流，开始录音只需约 20–40ms，不再丢字。
#
# 代价：登录期间麦克风的 PCM 一直打开，笔记本上音频 DSP 无法 runtime suspend，
# 会多耗一点电；没有应用在录音时不会有采集流，栏上也不会显示麦克风占用。
# 不想保留时删掉本文件并 systemctl --user restart wireplumber 即可。
#
# 只匹配 alsa_input.*：蓝牙源和外接声卡的挂起行为保持不变。
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_input.*"
      }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
