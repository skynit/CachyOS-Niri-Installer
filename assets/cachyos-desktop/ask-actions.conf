# cachyos-ask 的动作与提示词（Super+\ 或 cachyos-ask）
#
# 每行格式：动作名<TAB>提示词
#   - 覆盖内置动作：id 用下面这 7 个之一，改右边的话即可。位置与顺序不变。
#   - 新增动作：随便起个 id（字母开头，可含数字、_、-），会追加到选择器末尾。
#   - 空行与 # 开头的行忽略；格式不对的行会跳过并提示行号，其余行照常生效。
#
# 这个文件是可选的：删掉它就完全回到内置默认。改完重开一次 cachyos-ask 即生效。
#
# explain
explain	解释下面这段内容：它在做什么、关键点是什么、有没有坑。先给结论再展开。
# fix
fix	下面这段输出出错了。请定位原因，并给出可直接执行的修复步骤（先给结论，再给命令或补丁）。
# review
review	审查下面的改动，只指出真实问题（正确性、边界条件、并发、安全、性能），按严重程度排序，不要泛泛而谈。
# summarize
summarize	用中文总结下面这段内容，保留关键事实与数字，不要添加评论。
# translate
translate	把下面内容翻译成自然的中文技术表达，代码、命令与专有名词保留原文。
# commit
commit	根据下面的改动写一条提交信息：第一行不超过 72 字符、用祈使句，需要时再补正文列表。只输出提交信息本身。
# shell
shell	把下面这句话转换成可执行的 bash 命令，先给命令，再逐条简要说明参数；如有危险操作请显式提醒。
